# ACI Component Registry
# Single source of truth for every capability inside the system.
# status: active | stub (needs key) | planned

version: "1.0.0"
updated: "2026-11-23"

# ── Observability ──────────────────────────────────────────────
observability:
  - name: healthz
    type: endpoint
    status: active
    location: "GET /healthz"
    notes: "ok/db/db_kind/time — watched by aci-backend-watchdog every 15m"
  - name: mission_log
    type: event_log
    status: active
    location: "postgres: missions table"
    notes: "every mission persisted with status/result/confidence"
  - name: backend_logs
    type: logs
    status: active
    location: "~/workspace/aci/logs/ (uvicorn)"

# ── Memory / RAG / Graph ───────────────────────────────────────
memory:
  semantic_memory:
    status: active
    location: "POST /api/v1/memory | GET /api/v1/memory/recall"
    backend: "postgres table memories (fact, domain, embedding_tfidf); SQLite fallback ~/workspace/aci/data/aci.db"
